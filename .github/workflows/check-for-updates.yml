name: Check whether an image needs rebuilding

# Shared by the bwgc_* image repositories, called from each one's scheduled
# rebuild-on-updates.yml. It compares the image the repository last published
# with its base image and with the package index, and reports whether a
# rebuild is due. It builds nothing itself: the caller runs its own build
# workflow when needs_build is 'true'.
#
# Rebuilds on two signals: the base image's layers have moved, or packages
# inside the published image are behind the repository index (security
# updates the base digest alone would never reveal).
#
# By default it checks the image published from master. With release: true
# it checks the newest vX.Y.Z release instead, as published under its
# version tag, and returns that tag as ref for the caller to pass to
# build-image.yml. Only the newest release is checked: once a v2 exists, the
# 1 tags stop receiving rebuilds. A repository with no release yet reports
# needs_build 'false'.

on:
  workflow_call:
    inputs:
      release:
        description: Check the newest vX.Y.Z release instead of master
        type: boolean
        default: false
    outputs:
      needs_build:
        description: "'true' when the image should be rebuilt"
        value: ${{ jobs.check.outputs.needs_build }}
      reason:
        description: Why, in a few words
        value: ${{ jobs.check.outputs.reason }}
      ref:
        description: With release true, the release tag that was checked (empty if none)
        value: ${{ jobs.check.outputs.ref }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.decide.outputs.needs_build }}
      reason: ${{ steps.decide.outputs.reason }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so release mode can find the newest release.
          fetch-depth: 0
          # Read only: the token is not left in .git/config.
          persist-credentials: false

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare base image and package state
        id: decide
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -uo pipefail
          if [ "$RELEASE" = true ]; then
            REF=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            if [ -z "$REF" ]; then
              echo "needs_build=false" >> "$GITHUB_OUTPUT"
              echo "reason=no release yet" >> "$GITHUB_OUTPUT"
              echo "::notice::No vX.Y.Z release tag; nothing to check"
              exit 0
            fi
            # The release's own Dockerfile, which may pin a different base
            # from master's.
            DOCKERFILE=$(git show "$REF:Dockerfile")
            PUBLISHED="ghcr.io/${GITHUB_REPOSITORY,,}:${REF#v}"
          else
            DOCKERFILE=$(cat Dockerfile)
            PUBLISHED="ghcr.io/${GITHUB_REPOSITORY,,}:master"
          fi
          BASE=$(printf '%s\n' "$DOCKERFILE" | grep -m1 '^FROM' | sed 's/^FROM[[:space:]]*//')
          echo "base=$BASE published=$PUBLISHED"

          REASON=""

          # 1. Has the base image moved under us?
          docker pull -q "$BASE" >/dev/null 2>&1 || true
          if docker pull -q "$PUBLISHED" >/dev/null 2>&1; then
            # The published image is the base plus this repository's own layers,
            # so every base layer must appear, in order, at the start of it.
            # Comparing only the first layer misses a base whose upper layers
            # change on their own, such as a new application release on an
            # unchanged Alpine layer. An unreadable base forces a rebuild.
            BASE_LAYERS=$(docker image inspect "$BASE" --format '{{range .RootFS.Layers}}{{.}} {{end}}' 2>/dev/null || true)
            PUB_LAYERS=$(docker image inspect "$PUBLISHED" --format '{{range .RootFS.Layers}}{{.}} {{end}}' 2>/dev/null || true)
            case "$PUB_LAYERS" in
              "$BASE_LAYERS"*) [ -n "$BASE_LAYERS" ] || REASON="base image changed" ;;
              *) REASON="base image changed" ;;
            esac

            # 2. Are any installed packages behind the repository index?
            #    This is the case the old digest comparison could not see.
            OUTDATED=$(docker run --rm --entrypoint sh "$PUBLISHED" -c \
              "apk update >/dev/null 2>&1; apk version -l '<' 2>/dev/null | tail -n +2" || true)
            if [ -n "$OUTDATED" ]; then
              COUNT=$(printf '%s\n' "$OUTDATED" | grep -c . || true)
              echo "Outdated packages:"; printf '%s\n' "$OUTDATED"
              if [ -n "$REASON" ]; then
                REASON="$REASON; $COUNT package(s) outdated"
              else
                REASON="$COUNT package(s) outdated"
              fi
            fi
          else
            REASON="no published image yet"
          fi

          if [ -n "$REASON" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "::notice::Rebuilding: $REASON"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=nothing to do" >> "$GITHUB_OUTPUT"
            echo "::notice::Base image and packages are current; not rebuilding"
          fi
