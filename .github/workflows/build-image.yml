name: Build, test and publish an image

# Shared by the bwgc_* image repositories. Each repository keeps its own
# build-docker-image.yml with the triggers and path filters that suit it, and
# that file calls this one. Everything below is the same for every image.
#
# github.repository, actions/checkout and the gha build cache all refer to the
# CALLING repository, so the image is built from, cached for and published to
# the repository that called this workflow.
#
# The caller must grant every permission the build job asks for below, or the
# run fails before it starts.
#
# Signing note: cosign's keyless certificate names the workflow that signed.
# From here on that is this file in dadatuputi/bwgc_workflows, not the image
# repository's own workflow. Anyone verifying with --certificate-identity
# must use this file's path.

on:
  workflow_call:
    inputs:
      test-image:
        description: Local tag for the image the test suite runs against, e.g. bwgc_backup:test
        type: string
        required: true
      shellcheck:
        description: Shellcheck scripts/*.sh at warning level before building
        type: boolean
        default: false
      mailpit:
        description: Start a mailpit SMTP server for test suites that deliver mail
        type: boolean
        default: false
      ref:
        description: >-
          A release tag (vX.Y.Z) to build instead of the triggering commit. The
          scheduled rebuild passes the latest release here, so a security
          rebuild republishes that release and never unreleased code.
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The image the test suite runs against, built once here and loaded into
  # the local daemon. The publish step below rebuilds from the same cache.
  TEST_IMAGE: ${{ inputs.test-image }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A real SMTP server for the delivery case in the test suite. It takes any
    # login, so the authenticated path is exercised too, and offers no TLS,
    # so a starttls configuration must refuse it. Its ports are published on
    # the runner, where the test container reaches them as
    # host.docker.internal.
    #
    # Only callers that ask for it get the service: an empty image name tells
    # the runner not to start it.
    services:
      mailpit:
        image: ${{ inputs.mailpit && 'axllent/mailpit:v1.31.3' || '' }}
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 1025:1025
          - 8025:8025
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
      # Added for uploading SARIF results
      security-events: write

    steps:
      # github.repository keeps the owner's case, and image references must be
      # lowercase. metadata-action lowercases the tags it generates, but the
      # Trivy and cosign steps build the reference from IMAGE_NAME themselves,
      # so a fork owned by "Striffly" fails with "could not parse reference".
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # The test suite needs the checkout. The build context is the checkout
      # too, rather than the default git context, so the image under test is
      # built from exactly the files the tests mount.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Nothing here pushes to git, so the token is not left in
          # .git/config, where the build context and the test suite would
          # otherwise have it within reach.
          persist-credentials: false

      # The release being built, if any: the ref input on a scheduled rebuild,
      # or the pushed tag itself. Empty for a master or pull request build.
      - name: Work out the release
        id: release
        env:
          REF_INPUT: ${{ inputs.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "$REF_INPUT" ]; then TAG=$REF_INPUT
          elif [ "$REF_TYPE" = tag ]; then TAG=$REF_NAME
          else TAG=""
          fi
          case "$TAG" in
            ""|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG:-none}"

          FLOAT_MAJOR=true FLOAT_MINOR=true FLOAT_LATEST=true
          if [ -n "$TAG" ]; then
            if REMOTE=$(git ls-remote --tags --refs origin 'v*'); then
              TAGS=$(printf '%s\n' "$REMOTE" | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
              newest() { printf '%s\n' "$TAGS" | grep -E "$1" | sort -V | tail -n1; }
              V=${TAG#v}
              MAJOR=${V%%.*}
              MINOR=$(printf '%s' "$V" | cut -d. -f2)
              [ "$(newest '^v')" = "$TAG" ] || FLOAT_LATEST=false
              [ "$(newest "^v$MAJOR\\.")" = "$TAG" ] || FLOAT_MAJOR=false
              [ "$(newest "^v$MAJOR\\.$MINOR\\.")" = "$TAG" ] || FLOAT_MINOR=false
            else
              echo "::warning::Could not list the release tags; publishing every tag for $TAG"
            fi
          fi
          echo "float_major=$FLOAT_MAJOR" >> "$GITHUB_OUTPUT"
          echo "float_minor=$FLOAT_MINOR" >> "$GITHUB_OUTPUT"
          echo "float_latest=$FLOAT_LATEST" >> "$GITHUB_OUTPUT"
          [ -z "$TAG" ] || echo "Moves: major=$FLOAT_MAJOR minor=$FLOAT_MINOR latest=$FLOAT_LATEST"

      # Static analysis before anything is built. The image ships no
      # shellcheck, so the suite cannot run it; the runner has it.
      - name: Shellcheck the scripts
        if: inputs.shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning scripts/*.sh

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A master build publishes "master" plus a dated tag that never moves
          # (master-20260923-031500, UTC). "master" is republished on every
          # rebuild; the dated tag keeps naming this exact build afterwards, so a
          # deployment can pin it, roll back to it, or check that an image it
          # pulled earlier is still the one published. A rebuild of the same
          # commit gets a new tag, which a commit-SHA tag would not.
          #
          # A release build (a pushed v1.4.2 tag, or a scheduled rebuild given
          # ref: v1.4.2) publishes "1", "1.4", "1.4.2", "latest" and a dated
          # 1.4.2-20261105-031500. Deployments follow the major tag, which only
          # ever moves to a compatible release or a security rebuild of one.
          # None of the master tags are touched, even though a scheduled run
          # starts on master.
          tags: |
            type=schedule,enable=${{ steps.release.outputs.tag == '' }}
            type=ref,event=branch,enable=${{ steps.release.outputs.tag == '' }}
            type=ref,event=pr
            type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}},enable=${{ steps.release.outputs.tag == '' && '{{is_default_branch}}' || 'false' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' && steps.release.outputs.float_minor == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' && steps.release.outputs.float_major == 'true' }}
            type=raw,value=${{ steps.release.outputs.version }}-{{date 'YYYYMMDD-HHmmss'}},enable=${{ steps.release.outputs.tag != '' }}
          flavor: |
            latest=${{ steps.release.outputs.tag != '' && steps.release.outputs.float_latest == 'true' }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the image and load it into the local daemon so the test suite
      # can run inside it. Nothing is pushed yet: a build whose tests fail is
      # never published.
      #
      # Built from scratch every time, pulling the base image afresh. A cached
      # "RUN apk add" layer never changes while the Dockerfile does not, so a
      # cached build re-publishes the same packages indefinitely: the nightly
      # rebuild saw outdated packages, rebuilt, and pushed an image identical
      # to the last one. The fresh layers are still written to the cache, so
      # the publish step below reuses exactly what was tested.
      - name: Build the image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          pull: true
          no-cache: true
          tags: ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max

      # tests/run-tests.sh runs tests/in-container.sh inside the image just
      # built; BWGC_IMAGE tells it to use that image rather than build its own.
      - name: Run the test suite
        env:
          BWGC_SMTP_HOST: ${{ inputs.mailpit && 'host.docker.internal' || '' }}
          BWGC_SMTP_PORT: ${{ inputs.mailpit && '1025' || '' }}
          BWGC_MAILPIT_API: ${{ inputs.mailpit && 'http://host.docker.internal:8025' || '' }}
        run: BWGC_IMAGE="$TEST_IMAGE" ./tests/run-tests.sh

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      # Every layer is already in the cache from the build above, so this is
      # a re-tag and a push of the image the tests just passed on.
      - name: Build and push Docker image
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run Trivy vulnerability scanner on the built image
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Pin the scanner itself too. In March 2026, Trivy v0.69.4 to
          # v0.69.6 were published with a credential stealer.
          version: 'v0.74.0'

      # Upload Trivy scan results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: 'trivy-results.sarif'

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Sign the resulting Docker image digest
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the images with GitHub OIDC Token
        if: github.event_name != 'pull_request'
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        #
        # Every tag points at the same digest and the signature attaches to the
        # digest, so one signature covers them all. A slow Rekor upload can make
        # cosign's own retry hit 409 "equivalent entry already exists", so a failed
        # attempt is tried again, each with a fresh ephemeral key.
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            cosign sign --yes "$IMAGE_REF" && exit 0
            echo "::warning::cosign sign attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1
